# This file was autogenerated by actions.nix. Do not edit it manually.
# To make changes, edit the workflow definition in your flake's actions-nix configuration
# (typically under flake.actions-nix.workflows.".github/workflows/regenerate-workflows.yaml") and run:
#   nix run .#render-workflows
# Or commit to trigger the pre-commit hook if enabled.
jobs:
  regenerate:
    environment: renovate
    if: (github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name
      == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 2
        ref: ${{ github.head_ref || github.ref_name }}
        token: ${{ secrets.PAT }}
    - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877
    - uses: Mic92/hestia@dfed9ced335d28978ba74e513939a10db1f71025
      with:
        upstream-cache-filter: true
        upstream-cache-key-names: cache.nixos.org-1 nix-community.cachix.org-1 noctalia.cachix.org-1
          niri.cachix.org-1 bbigras-nix-config.cachix.org-1
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866
      with:
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
        extraPullNames: nix-community,noctalia,niri
        name: bbigras-nix-config
    - if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/nousresearch-hermes-agent-')
      name: Update Hermes lock file
      run: nix flake update hermes-agent
    - name: Regenerate workflows
      run: nix run .#render-workflows
    - name: Amend commit with generated files
      run: |-
        git config user.name "github[bot]"
        git config user.email "noreply@github.com"
        git add flake.lock .github/workflows/
        git diff --staged --quiet || git commit --amend --no-edit
        git push --force-with-lease
    - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'renovate/nousresearch-hermes-agent-')
      uses: peter-evans/enable-pull-request-automerge@a660677d5469627102a1c1e11409dd063606628d
      with:
        merge-method: rebase
        pull-request-number: ${{ github.event.pull_request.number }}
        token: ${{ secrets.PAT }}
    timeout-minutes: 60
name: regenerate-workflows
'on':
  pull_request:
    paths:
    - modules/flake-parts/actions.nix
    - flake.lock
    - flake.nix
  workflow_dispatch: {}
permissions:
  contents: write
  pull-requests: write
